version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres_lab
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: sandbox
    ports:
      - "5432:5432"
    volumes:
      - ./postgress-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser"]