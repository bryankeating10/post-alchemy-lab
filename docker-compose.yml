services:
  db:
    image: postgres:16
    container_name: postgres_lab
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: sandbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    container_name: lab
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    environment:
      DATABASE_URL: postgresql://labuser:labpass@db:5432/sandbox
    stdin_open: true
    tty: true

volumes:
  postgres-data:
